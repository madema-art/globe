name: Validate Globe foundation
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run content:validate
      - run: npm run content:publish
      - run: npm run content:develop -- --enable-development-content
      - run: npm run build
      - run: npm run test:build
      - run: npm run test:service
      - run: npm run test:browser
      - if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
        run: npm run test:earth
      - if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
        run: npm run test:ui
      - if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
        run: npm run test:game
      - if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
        run: npm run test:strategy
      - if: always()
        run: npm stop
